<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft 3D Drop Shadows -->
    <filter id="f-coin-shadow" x="-20%" y="-20%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#D97706" flood-opacity="0.3" />
    </filter>
    
    <filter id="f-back-coin-shadow" x="-20%" y="-20%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="-8" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="f-gold-rim-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="25%" stop-color="#FFD54F" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="75%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#BF360C" />
    </linearGradient>

    <linearGradient id="f-gold-rim-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="30%" stop-color="#FFE082" />
      <stop offset="60%" stop-color="#FFB300" />
      <stop offset="90%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#5D4037" />
    </linearGradient>

    <radialGradient id="f-gold-face-front" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="20%" stop-color="#FFF176" />
      <stop offset="50%" stop-color="#FFC107" />
      <stop offset="80%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#E65100" />
    </radialGradient>

    <radialGradient id="f-gold-face-back" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="30%" stop-color="#FFD54F" />
      <stop offset="65%" stop-color="#FFB300" />
      <stop offset="90%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#BF360C" />
    </radialGradient>

    <!-- Emerald Teal Play Button Gradient -->
    <linearGradient id="f-emerald-play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="40%" stop-color="#00B0FF" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#12544F" />
      <stop offset="100%" stop-color="#08302D" />
    </linearGradient>

    <linearGradient id="f-play-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <radialGradient id="f-sparkle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#FFF9C4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- BACK COIN -->
  <g filter="url(#f-back-coin-shadow)" transform="translate(160, 230) rotate(-18) translate(-160, -230)">
    <circle cx="160" cy="242" r="135" fill="#A84300" />
    <circle cx="160" cy="238" r="135" fill="#D97706" />
    <circle cx="160" cy="230" r="135" fill="url(#f-gold-rim-1)" stroke="#FFE082" stroke-width="3" />
    <circle cx="160" cy="230" r="122" fill="none" stroke="#B45309" stroke-width="4" stroke-dasharray="4 6" opacity="0.6" />
    <circle cx="160" cy="230" r="114" fill="url(#f-gold-face-back)" stroke="#FFF9C4" stroke-width="2" />

    <!-- ₨ Symbol -->
    <g transform="translate(160, 230) scale(1.15)">
      <path d="M-36 -32 H14 C28 -32 38 -22 38 -8 C38 6 28 16 14 16 H-14 V38 H-36 Z M-14 -8 H10 C16 -8 20 -12 20 -8 C20 -4 16 0 10 0 H-14 Z" fill="#78350F" opacity="0.2" transform="translate(2, 2)" />
      <path d="M-36 -32 H14 C28 -32 38 -22 38 -8 C38 6 28 16 14 16 H-14 V38 H-36 Z M-14 -8 H10 C16 -8 20 -12 20 -8 C20 -4 16 0 10 0 H-14 Z" fill="#FFFDE7" />
      <path d="M-4 -2 H24 L42 38 H20 L6 2 Z" fill="#78350F" opacity="0.2" transform="translate(2, 2)" />
      <path d="M-4 -2 H24 L42 38 H20 L6 2 Z" fill="#FFFDE7" />
    </g>
    <path d="M 60 170 A 114 114 0 0 1 240 140 A 100 100 0 0 0 80 200 Z" fill="#FFFFFF" opacity="0.35" />
  </g>

  <!-- FRONT COIN -->
  <g filter="url(#f-coin-shadow)">
    <circle cx="310" cy="292" r="162" fill="#7C2D12" />
    <circle cx="310" cy="288" r="162" fill="#9A3412" />
    <circle cx="310" cy="284" r="162" fill="#C2410C" />
    <circle cx="310" cy="280" r="162" fill="#D97706" />

    <circle cx="310" cy="272" r="162" fill="url(#f-gold-rim-2)" stroke="#FFFDE7" stroke-width="3.5" />
    <circle cx="310" cy="272" r="150" fill="none" stroke="#B45309" stroke-width="5" stroke-dasharray="4 7" opacity="0.75" />
    <circle cx="310" cy="272" r="136" fill="url(#f-gold-face-front)" stroke="#D97706" stroke-width="3" />
    
    <!-- Recess & Emerald Play -->
    <circle cx="310" cy="272" r="92" fill="#0E423E" stroke="url(#f-play-rim)" stroke-width="3" />
    <circle cx="310" cy="272" r="88" fill="url(#f-emerald-play)" />

    <!-- Play Triangle -->
    <polygon points="288,212 364,272 288,332" fill="#04201D" opacity="0.5" transform="translate(3, 4)" />
    <polygon points="286,210 362,272 286,334" fill="url(#f-gold-rim-1)" stroke="#FFFDE7" stroke-width="3" stroke-linejoin="round" />
    <polygon points="290,217 354,272 290,327" fill="url(#f-gold-face-front)" stroke="#B45309" stroke-width="1.5" stroke-linejoin="round" />
    <polygon points="292,222 342,272 292,272" fill="#FFFFFF" opacity="0.45" />

    <path d="M 195 210 A 136 136 0 0 1 405 180 A 120 120 0 0 0 220 235 Z" fill="#FFFFFF" opacity="0.4" />
  </g>

  <!-- SPARKLES -->
  <g transform="translate(110, 110)">
    <circle cx="0" cy="0" r="32" fill="url(#f-sparkle-glow)" />
    <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" fill="#FFFFFF" />
  </g>

  <g transform="translate(420, 150) scale(1.15)">
    <circle cx="0" cy="0" r="36" fill="url(#f-sparkle-glow)" />
    <path d="M 0 -34 Q 0 0 34 0 Q 0 0 0 34 Q 0 0 -34 0 Q 0 0 0 -34 Z" fill="#FFFFFF" />
  </g>
</svg>
